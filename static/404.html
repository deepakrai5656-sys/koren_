<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Page Not Found | MoviesExplain</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/moviesexplain1-icon.webp">
<link rel="stylesheet" href="/style.css?v=404">
<style>
.error-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}.error-card{width:min(620px,100%);padding:48px 30px;border:1px solid rgba(255,255,255,.09);border-radius:24px;background:linear-gradient(180deg,rgba(16,21,29,.96),rgba(8,11,16,.99));box-shadow:0 24px 70px rgba(0,0,0,.45)}.error-logo{width:190px;height:auto;margin:0 auto 28px}.error-code{font-size:clamp(5rem,18vw,9rem);line-height:.85;font-weight:900;letter-spacing:-.07em;color:#e50914;text-shadow:0 12px 40px rgba(229,9,20,.18)}h1{margin:22px 0 10px;font-size:clamp(1.6rem,5vw,2.4rem);color:#fff}p{margin:0 auto 26px;max-width:470px;color:#9da6b2;line-height:1.7}.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:10px;text-decoration:none;font-weight:750;border:1px solid rgba(255,255,255,.1);transition:.2s}.btn-primary{background:#e50914;color:#fff}.btn-secondary{background:rgba(255,255,255,.06);color:#fff}.btn:hover{transform:translateY(-2px)}@media(max-width:500px){.error-card{padding:38px 20px}.error-logo{width:165px}}
</style>
</head>
<body>
<main class="error-page">
<section class="error-card" aria-labelledby="error-title">
<img class="error-logo" src="/moviesexplain-logo.webp" alt="Movies Explain">
<div class="error-code">404</div>
<h1 id="error-title">Page Not Found</h1>
<p>Oops! Ye page available nahi hai. Ho sakta hai movie ka link change ho gaya ho ya page remove kar diya gaya ho.</p>
<div class="error-actions">
<a class="btn btn-primary" href="/">← Back to Home</a>
<a class="btn btn-secondary" href="/#moviesSection">🎬 Browse Movies</a>
</div>
</section>
</main>
</body>
</html>
